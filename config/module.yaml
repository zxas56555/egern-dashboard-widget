name: Egern Dashboard
description: 订阅流量、日期、到期时间与 VPN 启动入口
author: egern-dashboard-widget
homepage: https://github.com/zxas56555/egern-dashboard-widget
env_schema:
  SUBSCRIPTION_URL:
    name: 订阅地址
    description: 填写自己的 HTTPS 订阅地址，用于读取流量信息。
  SUBSCRIPTION_NAME:
    name: 订阅名称
    default_value: 我的订阅
  NODE_NAME:
    name: 节点名称
    description: 手动填写的展示名称，并非自动读取当前节点。
    default_value: 未设置
  USER_AGENT:
    name: 请求 User-Agent
    default_value: Egern
  REFRESH_MINUTES:
    name: 刷新间隔（分钟）
    default_value: '15'
  TIMEZONE_OFFSET:
    name: UTC 时区偏移
    default_value: '8'
  DEMO:
    name: 演示数据
    options:
      - 'true'
      - 'false'
scriptings:
  - generic:
      name: egern-dashboard
      script_url: https://raw.githubusercontent.com/zxas56555/egern-dashboard-widget/main/dist/dashboard.js?v=0.1.1
      timeout: 20
widgets:
  - name: 订阅仪表盘
    script_name: egern-dashboard
    env:
      SUBSCRIPTION_NAME: 我的订阅
      NODE_NAME: 未设置
      REFRESH_MINUTES: '15'
      TIMEZONE_OFFSET: '8'
      DEMO: 'false'
      # 在 Egern 的 Env 中填写 SUBSCRIPTION_URL，不要提交真实订阅地址。
